<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Component Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
        button { margin: 5px; padding: 8px 16px; }
        .dom-state { background: #f0f8ff; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Login Component Debug Test</h1>
    
    <div class="debug-section">
        <h2>Test Controls</h2>
        <button onclick="runDiagnostics()">Run Full Diagnostics</button>
        <button onclick="testGuestAccess()">Test Guest Access Creation</button>
        <button onclick="checkAuthentication()">Check Authentication State</button>
        <button onclick="clearStorage()">Clear All Storage</button>
    </div>

    <div class="debug-section">
        <h2>Initial Page Analysis</h2>
        <div id="page-analysis"></div>
    </div>

    <div class="debug-section">
        <h2>DOM State</h2>
        <div id="dom-state" class="dom-state"></div>
    </div>

    <div class="debug-section">
        <h2>Console Logs</h2>
        <div id="console-logs"></div>
    </div>

    <div class="debug-section">
        <h2>Authentication Analysis</h2>
        <div id="auth-analysis"></div>
    </div>

    <div class="debug-section">
        <h2>Error Analysis</h2>
        <div id="error-analysis"></div>
    </div>

    <script>
        // Store console logs
        const originalConsole = {
            log: console.log,
            error: console.error,
            warn: console.warn,
            info: console.info
        };

        let consoleLogs = [];

        // Override console methods to capture logs
        ['log', 'error', 'warn', 'info'].forEach(method => {
            console[method] = function(...args) {
                originalConsole[method].apply(console, args);
                consoleLogs.push({
                    method: method,
                    timestamp: new Date().toISOString(),
                    args: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg))
                });
            };
        });

        function displayResults() {
            document.getElementById('console-logs').innerHTML = consoleLogs
                .map(log => `<div class="${log.method}">[${log.timestamp}] ${log.method.toUpperCase()}: ${log.args.join(' ')}</div>`)
                .join('');
        }

        function checkDOMState() {
            const loginPage = document.getElementById('login-page');
            const mainApp = document.getElementById('main-app');
            const authLoading = document.getElementById('auth-loading');
            const authError = document.getElementById('auth-error');
            
            let domAnalysis = '<h3>DOM Element States:</h3>';
            
            if (loginPage) {
                const isActive = loginPage.classList.contains('active');
                const styleDisplay = loginPage.style.display;
                domAnalysis += `<div>Login Page: <span class="${isActive ? 'success' : 'warning'}">active=${isActive}</span>, display=${styleDisplay}</div>`;
            } else {
                domAnalysis += '<div class="error">Login Page: Not found</div>';
            }
            
            if (mainApp) {
                const styleDisplay = mainApp.style.display;
                domAnalysis += `<div>Main App: display=${styleDisplay}</div>`;
            } else {
                domAnalysis += '<div class="error">Main App: Not found</div>';
            }
            
            if (authLoading) {
                const styleDisplay = authLoading.style.display;
                domAnalysis += `<div>Auth Loading: display=${styleDisplay}</div>`;
            } else {
                domAnalysis += '<div class="error">Auth Loading: Not found</div>';
            }
            
            if (authError) {
                const styleDisplay = authError.style.display;
                domAnalysis += `<div>Auth Error: display=${styleDisplay}</div>`;
            } else {
                domAnalysis += '<div class="error">Auth Error: Not found</div>';
            }

            // Check for login component specifically
            const loginComponent = document.querySelector('login-component');
            if (loginComponent) {
                domAnalysis += `<div>Login Component: <span class="success">Found</span></div>`;
                domAnalysis += `<div>Login Component Parent: ${loginComponent.parentElement?.className || 'No parent class'}</div>`;
            } else {
                domAnalysis += '<div class="error">Login Component: Not found</div>';
            }

            document.getElementById('dom-state').innerHTML = domAnalysis;
        }

        async function checkAuthentication() {
            let authAnalysis = '<h3>Authentication Analysis:</h3>';
            
            try {
                // Check localStorage
                const userKey = 'auth_user';
                const tokenKey = 'access_token';
                
                const storedUser = localStorage.getItem(userKey);
                const storedToken = localStorage.getItem(tokenKey);
                
                authAnalysis += `<div>Stored User: ${storedUser ? '<span class="success">Present</span>' : '<span class="warning">Absent</span>'}</div>`;
                authAnalysis += `<div>Stored Token: ${storedToken ? '<span class="success">Present</span>' : '<span class="warning">Absent</span>'}</div>`;
                
                if (storedUser) {
                    const user = JSON.parse(storedUser);
                    authAnalysis += `<div>User isGuest: ${user.is_guest ? '<span class="success">Yes</span>' : '<span class="warning">No</span>'}</div>`;
                    authAnalysis += `<div>User role: ${user.role || 'None'}</div>`;
                    authAnalysis += `<div>User username: ${user.username || 'None'}</div>`;
                }
                
                // Check if auth context exists
                if (window.authContext) {
                    const authState = window.authContext.getState();
                    authAnalysis += `<div>Auth Context State: <pre>${JSON.stringify(authState, null, 2)}</pre></div>`;
                } else {
                    authAnalysis += '<div class="error">Auth Context: Not available</div>';
                }
                
            } catch (error) {
                authAnalysis += `<div class="error">Authentication check error: ${error.message}</div>`;
            }
            
            document.getElementById('auth-analysis').innerHTML = authAnalysis;
        }

        async function testGuestAccess() {
            let result = '<h3>Guest Access Test:</h3>';
            
            try {
                // Simulate the guest access creation flow
                if (window.authService && window.authService.ensureGuestAccess) {
                    console.log('Testing guest access creation...');
                    const response = await window.authService.ensureGuestAccess();
                    result += `<div>Guest Access Response: <pre>${JSON.stringify(response, null, 2)}</pre></div>`;
                } else {
                    result += '<div class="error">AuthService.ensureGuestAccess not available</div>';
                }
            } catch (error) {
                result += `<div class="error">Guest access test error: ${error.message}</div>`;
            }
            
            document.getElementById('auth-analysis').innerHTML += result;
        }

        async function runDiagnostics() {
            console.log('=== RUNNING DIAGNOSTICS ===');
            
            // Clear previous results
            document.getElementById('page-analysis').innerHTML = '';
            document.getElementById('dom-state').innerHTML = '';
            document.getElementById('auth-analysis').innerHTML = '';
            document.getElementById('error-analysis').innerHTML = '';
            consoleLogs = [];
            
            // Basic page analysis
            let pageAnalysis = '<h3>Page Information:</h3>';
            pageAnalysis += `<div>Current URL: ${window.location.href}</div>`;
            pageAnalysis += `<div>Current Time: ${new Date().toISOString()}</div>`;
            pageAnalysis += `<div>Document Ready State: ${document.readyState}</div>`;
            
            // Check if we're on the correct page
            if (window.location.href.includes('127.0.0.1:5173') || window.location.hostname === 'localhost') {
                pageAnalysis += '<div class="success">✓ Running on development server</div>';
            } else {
                pageAnalysis += '<div class="warning">⚠ Not running on development server</div>';
            }
            
            document.getElementById('page-analysis').innerHTML = pageAnalysis;
            
            // Run checks
            await checkAuthentication();
            checkDOMState();
            
            // Display console logs after a delay to capture async operations
            setTimeout(displayResults, 2000);
            
            console.log('=== DIAGNOSTICS COMPLETE ===');
        }

        function clearStorage() {
            localStorage.clear();
            console.log('All storage cleared');
            document.getElementById('auth-analysis').innerHTML += '<div class="warning">Storage cleared - refresh page to test fresh state</div>';
        }

        // Auto-run basic diagnostics on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkDOMState();
                checkAuthentication();
                displayResults();
            }, 1000);
        });

        // Make functions available globally for testing
        window.runDiagnostics = runDiagnostics;
        window.testGuestAccess = testGuestAccess;
        window.checkAuthentication = checkAuthentication;
        window.clearStorage = clearStorage;
    </script>

    <!-- Embed the actual application in an iframe for testing -->
    <div class="debug-section">
        <h2>Application Test Frame</h2>
        <iframe id="app-frame" src="http://127.0.0.1:5173" width="100%" height="600" style="border: 1px solid #ccc;"></iframe>
        <p><strong>Instructions:</strong> The actual application is loaded in the iframe above. Use the diagnostic buttons to check the state of the embedded application.</p>
    </div>
</body>
</html>
