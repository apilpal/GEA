<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Initialization Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .status { padding: 10px; margin: 5px 0; border-radius: 3px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        pre { background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 3px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Frontend Authentication Initialization Test</h1>
    
    <div class="test-container">
        <h2>Test Status</h2>
        <div id="status"></div>
    </div>

    <div class="test-container">
        <h2>Authentication Details</h2>
        <div id="auth-details"></div>
    </div>

    <div class="test-container">
        <h2>Console Logs</h2>
        <div id="console-logs"></div>
    </div>

    <script>
        let consoleLogs = [];
        let originalConsoleLog = console.log;
        let originalConsoleError = console.error;

        // Capture console logs
        console.log = function(...args) {
            consoleLogs.push({ type: 'log', message: args.join(' '), timestamp: new Date().toISOString() });
            originalConsoleLog.apply(console, args);
        };

        console.error = function(...args) {
            consoleLogs.push({ type: 'error', message: args.join(' '), timestamp: new Date().toISOString() });
            originalConsoleError.apply(console, args);
        };

        function updateStatus() {
            const statusDiv = document.getElementById('status');
            const authDetailsDiv = document.getElementById('auth-details');
            const consoleLogsDiv = document.getElementById('console-logs');

            // Check if auth context exists
            const authContext = window.authContext;
            if (!authContext) {
                statusDiv.innerHTML = '<div class="error">❌ Auth context not found on window object</div>';
                return;
            }

            // Get auth state
            try {
                const state = authContext.getState();
                const isLoading = state.isLoading;
                const isAuthenticated = state.isAuthenticated;
                const user = state.user;

                let statusHtml = '';
                if (isLoading) {
                    statusHtml += '<div class="warning">⏳ Authentication is still loading...</div>';
                } else if (isAuthenticated) {
                    statusHtml += '<div class="success">✅ User is authenticated</div>';
                } else {
                    statusHtml += '<div class="error">❌ User is not authenticated</div>';
                }

                if (user) {
                    statusHtml += `<div class="info">👤 User: ${user.username} (${user.role})</div>`;
                    if (user.is_guest) {
                        statusHtml += '<div class="info">👤 This is a guest user</div>';
                    }
                }

                statusDiv.innerHTML = statusHtml;

                // Show detailed auth information
                authDetailsDiv.innerHTML = '<pre>' + JSON.stringify({
                    state: state,
                    timestamp: new Date().toISOString()
                }, null, 2) + '</pre>';

            } catch (error) {
                statusDiv.innerHTML = `<div class="error">❌ Error getting auth state: ${error.message}</div>`;
            }

            // Show console logs
            let logsHtml = '';
            consoleLogs.forEach(log => {
                const className = log.type === 'error' ? 'error' : 'info';
                logsHtml += `<div class="${className}">[${log.timestamp}] ${log.message}</div>`;
            });
            consoleLogsDiv.innerHTML = logsHtml || '<div class="info">No console logs captured yet</div>';
        }

        // Update status every second
        setInterval(updateStatus, 1000);

        // Initial update
        updateStatus();

        // Test manual guest auth
        window.testGuestAuth = async function() {
            try {
                console.log('🔄 Testing manual guest authentication...');
                const response = await fetch('/api/auth/guest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });
                const data = await response.json();
                console.log('📡 Guest auth response:', data);
                return data;
            } catch (error) {
                console.error('❌ Guest auth failed:', error);
                return null;
            }
        };

        // Test guest dashboard API
        window.testGuestDashboard = async function() {
            try {
                console.log('🔄 Testing guest dashboard API...');
                const response = await fetch('/api/dashboard/public/stats', {
                    credentials: 'include'
                });
                const data = await response.json();
                console.log('📊 Guest dashboard response:', data);
                return data;
            } catch (error) {
                console.error('❌ Guest dashboard failed:', error);
                return null;
            }
        };

        console.log('🧪 Authentication test page loaded. Running initialization checks...');
    </script>
    
    <!-- Include the main app -->
    <iframe src="http://127.0.0.1:5173" style="width: 100%; height: 800px; border: 1px solid #ccc; margin-top: 20px;" id="main-app-iframe"></iframe>

    <div style="margin-top: 20px;">
        <button onclick="testGuestAuth()">Test Guest Auth API</button>
        <button onclick="testGuestDashboard()">Test Guest Dashboard API</button>
        <button onclick="location.reload()">Reload Page</button>
    </div>
</body>
</html>
