# Quality Gates Configuration
# This file defines the quality standards for the project

quality_gates:
  coverage:
    minimum_overall: 90.0
    minimum_branch: 85.0
    minimum_line: 90.0

  test_results:
    max_failures: 0
    max_errors: 0
    max_skipped: 10

  performance:
    max_test_duration: 60  # seconds
    max_memory_increase: 100  # MB
    min_throughput: 100  # requests per second

  code_quality:
    max_complexity: 10
    max_line_length: 88
    max_file_length: 500
    min_test_coverage: 85.0

  security:
    require_https: true
    require_auth: true
    max_vulnerabilities: 0
    require_dependency_updates: true

# Environment-specific quality gates
environments:
  development:
    coverage:
      minimum_overall: 70.0
      minimum_branch: 60.0
    test_results:
      max_failures: 5
      max_errors: 3

  staging:
    coverage:
      minimum_overall: 80.0
      minimum_branch: 75.0
    test_results:
      max_failures: 1
      max_errors: 0

  production:
    coverage:
      minimum_overall: 90.0
      minimum_branch: 85.0
    test_results:
      max_failures: 0
      max_errors: 0

# Test type specific requirements
test_types:
  unit:
    coverage: 90.0
    max_duration: 30
    min_assertions: 3

  integration:
    coverage: 85.0
    max_duration: 120
    require_database: true

  api:
    coverage: 80.0
    max_duration: 60
    require_auth: true

  performance:
    coverage: 75.0
    max_duration: 300
    require_benchmark: true

# Quality check commands
quality_checks:
  - name: "Test Coverage"
    command: "python run_coverage.py --fail-under 90"
    critical: true

  - name: "Code Style"
    command: "black --check backend/src/"
    critical: true

  - name: "Import Sorting"
    command: "isort --check-only backend/src/"
    critical: true

  - name: "Type Checking"
    command: "mypy backend/src/"
    critical: false

  - name: "Security Scan"
    command: "safety check"
    critical: true

  - name: "Dependency Updates"
    command: "python -c 'import outdated; outdated.check()'"
    critical: false

# Quality gate scripts
scripts:
  pre_commit:
    - "python run_tests.py --fast --unit"
    - "black --check backend/src/"
    - "isort --check-only backend/src/"

  pre_push:
    - "python run_tests.py --coverage"
    - "python run_coverage.py --fail-under 85"

  pre_release:
    - "python run_tests.py --quality-gates"
    - "python run_coverage.py --fail-under 90"
    - "safety check"
    - "python -m mypy backend/src/"

# Notification settings
notifications:
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#quality-gates"

  email:
    enabled: false
    recipients:
      - "dev-team@example.com"
      - "qa-team@example.com"

  github:
    enabled: true
    token: "${GITHUB_TOKEN}"
    repository: "your-org/your-repo"

# Failure actions
failure_actions:
  block_merge: true
  notify_team: true
  create_issue: true
  update_status: true

# Success actions
success_actions:
  update_status: true
  notify_team: false
  deploy_ready: false