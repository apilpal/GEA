services:
  # FastAPI Application
  app:
    build: .
    container_name: fastapi-app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - HOST=127.0.0.1
      - PORT=8000
      - SSL_CERT_PATH=/app/certs/dev.crt
      - SSL_KEY_PATH=/app/certs/dev.key
      - DATABASE_URL=postgresql://postgres:password@db:5432/students_db
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - app_logs:/var/log/app
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - db
    networks:
      - app-network

  # Nginx Reverse Proxy with SSL Termination
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - app-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=students_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - app-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Certificate renewal service
  cert-renewal:
    build: .
    container_name: cert-renewal
    restart: unless-stopped
    command: sh -c "while true; do sleep 12h; /app/scripts/renew_certificates.sh; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./scripts:/app/scripts:ro
      - cert_logs:/var/log/cert-renewal
    networks:
      - app-network

  # Monitoring service for SSL certificates
  ssl-monitor:
    image: curlimages/curl:latest
    container_name: ssl-monitor
    restart: unless-stopped
    command: >
      sh -c "
        while true; do
          echo \"\$$(date): Checking SSL certificate status...\"
          if [ -f /etc/letsencrypt/live/$$DOMAIN/fullchain.pem ]; then
            expiry=\$$(openssl x509 -in /etc/letsencrypt/live/$$DOMAIN/fullchain.pem -noout -enddate | cut -d= -f2)
            echo \"SSL certificate expires: \$$expiry\"
          else
            echo 'No SSL certificate found'
          fi
          sleep 24h
        done
      "
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - app-network

volumes:
  db_data:
  redis_data:
  letsencrypt:
  app_logs:
  nginx_logs:
  cert_logs:

networks:
  app-network:
    driver: bridge