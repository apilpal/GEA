[tool:pytest]
# Main test configuration for the backend
minversion = 8.0
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --cov=backend/src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --cov-branch
    --asyncio-mode=auto
    --durations=10
    --durations-min=1.0
    -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:sqlalchemy.*
    ignore::UserWarning:asyncio.*
    ignore::UserWarning:urllib3.*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database
    api: marks tests that test API endpoints
    auth: marks tests that test authentication
    guest: marks tests for guest user functionality
    performance: marks tests that measure performance
    benchmark: marks tests that use benchmarking
    asyncio: marks tests that use asyncio
    docker: marks tests that require Docker
    external: marks tests that require external services
asyncio_mode = auto

[coverage:run]
source = backend/src
omit =
    */tests/*
    */test_*
    */conftest.py
    */migrations/*
    */alembic/*
    */__pycache__/*
    */.venv/*
    */venv/*
    */env/*
    */.tox/*
    */.pytest_cache/*
    */htmlcov/*
    */.coverage.*
    */coverage.xml
    */build/*
    */dist/*
    backend/src/core/models/__init__.py
    backend/src/services/__init__.py
    backend/src/api/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
    def .*test_.*\(
    def .*Test.*\(
    @pytest\.(fixture|mark|parametrize)
    def .*_test.*\(

[coverage:html]
directory = htmlcov
title = Backend Test Coverage Report

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json

# Test configuration for different environments
[tool:pytest:ci]
addopts =
    --cov-fail-under=85
    --junitxml=junit.xml
    --timeout=300
    --maxfail=5
    -q

[tool:pytest:dev]
addopts =
    --cov-fail-under=70
    --timeout=60
    --maxfail=1
    -v

[tool:pytest:integration]
addopts =
    --cov-fail-under=75
    --timeout=120
    -m "integration"
    -v

[tool:pytest:performance]
addopts =
    --durations=20
    --durations-min=0.5
    -m "performance or benchmark"
    -v

# Database test configuration
[tool:pytest:database]
addopts =
    -m "database"
    --timeout=180
    --maxfail=3
    -v

# Quality gates configuration
[tool:pytest:quality]
addopts =
    --cov-fail-under=90
    --timeout=60
    --maxfail=0
    --durations=20
    --durations-min=0.1
    -q

# Test discovery and collection
[tool:pytest:collect]
testpaths = .
norecursedirs = .venv venv env .tox .pytest_cache htmlcov .git __pycache__ build dist migrations alembic