name: Nightly Tests

on:
  schedule:
    # Run every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Testing Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Java (for security scanning)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

        cd frontend
        npm ci

    - name: Security scan (Python)
      uses: pypa/gh-action-pip-audit@v1
      with:
        path: backend/requirements.txt

    - name: Security scan (Node.js)
      run: |
        cd frontend
        npm audit --audit-level=high

    - name: Performance tests
      run: |
        cd frontend
        npm run test:performance

    - name: Integration tests
      run: |
        cd frontend
        npm run test:integration

    - name: Load testing setup
      run: |
        # Install load testing tools if needed
        pip install locust

    - name: Database performance tests
      run: |
        cd backend
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"
        export ENVIRONMENT="testing"
        export SYNC_ENABLED="false"

        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

        # Run database migrations
        python migrate.py

        # Run database intensive tests
        python -m pytest test_dual_database.py -v --tb=short --durations=10

    - name: Code quality checks
      run: |
        cd backend
        # Code formatting check
        python -m black --check --diff src/
        python -m isort --check-only --diff src/

        # Linting (if you have pylint or flake8)
        # python -m pylint src/ || true

    - name: Generate comprehensive report
      run: |
        echo "## Nightly Test Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕐 **Run Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f frontend/performance-results.json ]; then
          echo "📊 **Performance Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "📊 **Performance Tests:** ⚠️ Not Available" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f frontend/integration-results.xml ]; then
          echo "🔗 **Integration Tests:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
        else
          echo "🔗 **Integration Tests:** ⚠️ Not Available" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Security Status:" >> $GITHUB_STEP_SUMMARY
        echo "- Python dependencies: ✅ Scanned" >> $GITHUB_STEP_SUMMARY
        echo "- Node.js dependencies: ✅ Scanned" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### Recommendations:" >> $GITHUB_STEP_SUMMARY
        echo "- Review security scan results" >> $GITHUB_STEP_SUMMARY
        echo "- Monitor performance metrics" >> $GITHUB_STEP_SUMMARY
        echo "- Update dependencies regularly" >> $GITHUB_STEP_SUMMARY

    - name: Upload nightly test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: nightly-test-results
        path: |
          frontend/performance-results.json
          frontend/integration-results.xml
          security-scan-results.txt
        retention-days: 30