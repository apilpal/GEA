name: Create GEA roadmap issues

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: "false = preview only; true = create missing issues"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  create-roadmap-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preview or create missing roadmap issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const confirmCreate = "${{ inputs.confirm_create }}" === "true";
            const items = JSON.parse(fs.readFileSync('.github/issue-data/roadmap-issues.json', 'utf8'));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const titles = new Set(existing.map(x => x.title.toLowerCase()));
            const markers = new Set(existing.map(x => ((x.body || '').match(/<!-- GEA-ROADMAP:([A-Z]+-\d+) -->/) || [])[1]).filter(Boolean));
            const rows = [];
            for (const item of items) {
              if (titles.has(item.title.toLowerCase()) || markers.has(item.key)) {
                rows.push([item.key, 'skipped (already exists)', '']);
                continue;
              }
              if (!confirmCreate) { rows.push([item.key, 'preview only', '']); continue; }
              const created = await github.rest.issues.create({ owner, repo, title: item.title, body: item.body });
              titles.add(item.title.toLowerCase()); markers.add(item.key);
              rows.push([item.key, 'created', created.data.html_url]);
            }
            core.summary.addHeading('GEA roadmap issue creation').addTable([
              [{data:'Issue',header:true},{data:'Result',header:true},{data:'URL',header:true}], ...rows
            ]).addRaw(`\nMode: ${confirmCreate ? 'CREATE' : 'PREVIEW ONLY'}\n`).write();
            core.info(`Total: ${items.length}; created: ${rows.filter(r => r[1] === 'created').length}; skipped: ${rows.filter(r => r[1].startsWith('skipped')).length}; preview: ${rows.filter(r => r[1] === 'preview only').length}`);
