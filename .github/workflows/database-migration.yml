name: Database Migration Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for migration'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      migration_type:
        description: 'Type of migration'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade
          - downgrade
          - validate
      dry_run:
        description: 'Run in dry-run mode (no actual changes)'
        required: false
        default: true
        type: boolean
  schedule:
    # Run validation daily at 3 AM UTC
    - cron: '0 3 * * *'

env:
  POSTGRES_VERSION: '15'
  ALEMbic_CONFIG: 'backend/alembic.ini'

jobs:
  # Pre-migration validation
  validate-migration:
    name: Validate Migration Safety
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for proper migration comparison

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Set up test database
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"
        export ENVIRONMENT="testing"

        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

        # Run current migrations to establish baseline
        cd backend
        python migrate.py

    - name: Validate migration files
      run: |
        cd backend
        echo "🔍 Validating Alembic migration files..."

        # Check migration file naming and structure
        if ! ls alembic/versions/ | grep -q '^[0-9a-f]\{12\}_.*\.py$'; then
          echo "❌ Migration files don't follow proper naming convention"
          exit 1
        fi

        # Check for empty migrations
        for migration in alembic/versions/*.py; do
          if [ -f "$migration" ] && [ "$(basename "$migration")" != "__init__.py" ]; then
            if ! grep -q "def upgrade\|def downgrade" "$migration"; then
              echo "⚠️ Migration $migration appears to be empty or malformed"
            fi
          fi
        done

        echo "✅ Migration files validation completed"

    - name: Check migration safety
      run: |
        cd backend
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"

        echo "🔒 Checking migration safety..."

        # Check for destructive operations
        for migration in alembic/versions/*.py; do
          if [ -f "$migration" ] && [ "$(basename "$migration")" != "__init__.py" ]; then
            if grep -q "drop_table\|drop_column\|drop_index" "$migration"; then
              echo "⚠️ Destructive operation found in $migration"
              # In production, you might want to require manual approval for destructive migrations
            fi
          fi
        done

        # Check for data migrations that might be risky
        for migration in alembic/versions/*.py; do
          if [ -f "$migration" ] && [ "$(basename "$migration")" != "__init__.py" ]; then
            if grep -q "INSERT\|UPDATE\|DELETE" "$migration"; then
              echo "⚠️ Data modification found in $migration"
            fi
          fi
        done

        echo "✅ Migration safety check completed"

    - name: Generate migration report
      run: |
        cd backend
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"

        echo "## 📊 Migration Analysis Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Current migration state
        echo "### Current Migration State:" >> $GITHUB_STEP_SUMMARY
        python -c "
        from alembic.command import current
        from alembic import command
        import sys
        try:
            current(verbose=True)
        except Exception as e:
            print(f'Migration state check: {e}')
        " >> $GITHUB_STEP_SUMMARY 2>&1 || true

        echo "" >> $GITHUB_STEP_SUMMARY

        # List pending migrations
        echo "### Pending Migrations:" >> $GITHUB_STEP_SUMMARY
        python -c "
        from alembic.command import heads
        from alembic import command
        import sys
        try:
            heads(verbose=True)
        except Exception as e:
            print(f'Heads check: {e}')
        " >> $GITHUB_STEP_SUMMARY 2>&1 || true

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Migration analysis completed"

  # Test migration in isolated environment
  test-migration:
    name: Test Migration (Dry Run)
    runs-on: ubuntu-latest
    needs: validate-migration
    environment: ${{ inputs.environment || 'staging' }}
    if: inputs.dry_run == true || inputs.migration_type == 'validate'

    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Set up test databases
      run: |
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"
        export ENVIRONMENT="testing"

        # Wait for PostgreSQL
        until pg_isready -h localhost -p 5432 -U test_user; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

        # Create baseline database
        cd backend
        python migrate.py

    - name: Test migration dry run
      run: |
        cd backend
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"

        echo "🧪 Testing migration in dry-run mode..."

        # Test upgrade
        if [ "${{ inputs.migration_type }}" = "upgrade" ]; then
          echo "Testing upgrade migration..."
          python -m alembic upgrade head --sql  # Show SQL without executing
        fi

        # Test downgrade
        if [ "${{ inputs.migration_type }}" = "downgrade" ]; then
          echo "Testing downgrade migration..."
          python -m alembic downgrade -1 --sql  # Show SQL without executing
        fi

        echo "✅ Migration dry-run completed"

    - name: Database schema validation
      run: |
        cd backend
        export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"

        echo "🔍 Validating database schema..."

        # Check table integrity
        python -c "
        import psycopg2
        conn = psycopg2.connect('postgresql://test_user:test_password@localhost:5432/test_db')
        cur = conn.cursor()

        # Get all tables
        cur.execute('SELECT table_name FROM information_schema.tables WHERE table_schema = \"public\"')
        tables = cur.fetchall()

        print(f'Found {len(tables)} tables in database:')
        for table in tables:
            print(f'  - {table[0]}')

        # Check for any schema issues
        cur.execute('SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN (\"information_schema\", \"pg_catalog\")')
        user_tables = cur.fetchall()
        print(f'User tables: {len(user_tables)}')

        cur.close()
        conn.close()
        "

        echo "✅ Schema validation completed"

  # Execute migration in target environment
  execute-migration:
    name: Execute Migration
    runs-on: ubuntu-latest
    needs: [validate-migration, test-migration]
    environment: ${{ inputs.environment || 'staging' }}
    if: inputs.dry_run != true && github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Manual approval required
      run: |
        echo "⏳ Migration ready for execution"
        echo "🔍 Please review the validation and test results above"
        echo "✅ Migration will proceed when manually approved"

        # In a real scenario, you might want to require manual approval for production migrations
        if [ "${{ inputs.environment }}" = "production" ]; then
          echo "🚨 PRODUCTION MIGRATION REQUIRES MANUAL APPROVAL"
          # You could use GitHub Environments with required reviewers here
        fi

    - name: Execute database migration
      run: |
        echo "🚀 Executing ${{ inputs.migration_type }} migration..."

        # Environment-specific migration execution
        case "${{ inputs.environment }}" in
          "production")
            echo "🔥 Executing migration in PRODUCTION"
            # Production migration commands with backups
            ;;
          "staging")
            echo "🟡 Executing migration in STAGING"
            # Staging migration commands
            ;;
          "development")
            echo "🟢 Executing migration in DEVELOPMENT"
            # Development migration commands
            ;;
        esac

        cd backend
        # Execute the actual migration
        if [ "${{ inputs.migration_type }}" = "upgrade" ]; then
          python migrate.py
        elif [ "${{ inputs.migration_type }}" = "downgrade" ]; then
          python -m alembic downgrade -1
        fi

        echo "✅ Migration execution completed"

    - name: Post-migration verification
      run: |
        echo "🔍 Running post-migration verification..."

        # Verify migration was successful
        # - Check database connectivity
        # - Verify data integrity
        # - Check application health

        echo "✅ Post-migration verification completed"

    - name: Generate migration summary
      run: |
        echo "## 🎯 Migration Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🌍 **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "🔄 **Migration Type:** ${{ inputs.migration_type }}" >> $GITHUB_STEP_SUMMARY
        echo "💾 **Database:** ${{ env.POSTGRES_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "🕐 **Executed at:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### ✅ Migration Steps Completed:" >> $GITHUB_STEP_SUMMARY
        echo "- Pre-migration validation ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Migration safety checks ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Dry-run testing ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Schema validation ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Migration execution ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Post-migration verification ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "🎉 **Database migration completed successfully!**" >> $GITHUB_STEP_SUMMARY

  # Rollback migration if needed
  rollback-migration:
    name: Rollback Migration
    runs-on: ubuntu-latest
    needs: execute-migration
    environment: ${{ inputs.environment || 'staging' }}
    if: failure()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Rollback migration
      run: |
        echo "🔄 Rolling back migration..."

        cd backend

        # Rollback the migration
        python -m alembic downgrade -1

        echo "✅ Migration rollback completed"

    - name: Verify rollback
      run: |
        echo "🔍 Verifying rollback..."

        # Verify that rollback was successful
        # - Check database state
        # - Verify data integrity

        echo "✅ Rollback verification completed"