
name: Update roadmap issue types

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without updating issues"
        type: boolean
        required: true
        default: true
      confirm:
        description: "Confirm applying Task issue types"
        type: boolean
        required: true
        default: false

permissions:
  issues: write

jobs:
  update-types:
    runs-on: ubuntu-latest

    steps:
      - name: Update roadmap issue types
        uses: actions/github-script@v7
        with:
          script: |
            const dryRun = ${{ inputs.dry_run }};
            const confirm = ${{ inputs.confirm }};

            if (!dryRun && !confirm) {
              core.setFailed(
                "Set confirm=true before applying changes."
              );
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100
              }
            );

            const targets = issues.filter(issue =>
              !issue.pull_request &&
              issue.number >= 103 &&
              issue.number <= 130 &&
              issue.state === "open"
            );

            let updated = 0;
            let unchanged = 0;
            let failed = 0;

            for (const issue of targets) {
              const currentType =
                typeof issue.type === "string"
                  ? issue.type
                  : issue.type?.name ?? null;

              if (currentType === "Task") {
                core.info(
                  `SKIP #${issue.number}: already Task`
                );
                unchanged++;
                continue;
              }

              if (dryRun) {
                core.info(
                  `DRY RUN #${issue.number}: ` +
                  `${currentType ?? "unset"} -> Task`
                );
                continue;
              }

              try {
                const response =
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    type: "Task"
                  });

                const result = response.data;
                const actualType =
                  typeof result.type === "string"
                    ? result.type
                    : result.type?.name ?? null;

                if (actualType !== "Task") {
                  throw new Error(
                    `Expected Task, got ${actualType}`
                  );
                }

                core.info(
                  `UPDATED #${issue.number}: Task`
                );
                updated++;
              } catch (error) {
                core.error(
                  `FAILED #${issue.number}: ${error.message}`
                );
                failed++;
              }
            }

            core.summary
              .addHeading("Issue type update report")
              .addTable([
                [
                  {data: "Result", header: true},
                  {data: "Count", header: true}
                ],
                ["Target issues", targets.length],
                ["Updated", updated],
                ["Already Task", unchanged],
                ["Failed", failed]
              ])
              .write();

            if (dryRun) {
              core.info(
                "Preview only. No issues were changed."
              );
            }

            if (failed > 0) {
              core.setFailed(
                `${failed} issue type updates failed.`
              );
            }

