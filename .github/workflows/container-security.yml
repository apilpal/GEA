name: Container Security Scanning

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Security scan type'
        required: true
        default: 'comprehensive'
        type: choice
        options:
          - comprehensive
          - vulnerability-scan
          - compliance-scan
          - secret-scan
      severity_threshold:
        description: 'Minimum severity to fail on'
        required: false
        default: 'HIGH'
        type: choice
        options:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      include_dev_dependencies:
        description: 'Include development dependencies in scan'
        required: false
        default: false
        type: boolean
  schedule:
    # Run security scans daily at 1 AM UTC
    - cron: '0 1 * * *'
  push:
    branches: [ main, develop ]
    paths:
      - '**/Dockerfile*'
      - '**/requirements*.txt'
      - '**/package*.json'
      - '.github/workflows/container-security.yml'

env:
  TRIVY_VERSION: 'latest'
  DOCKER_SCAN_VERSION: 'latest'
  GRYPE_VERSION: 'latest'

jobs:
  # Container image vulnerability scanning
  container-vulnerability-scan:
    name: Container Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Install security scanning tools
      run: |
        echo "🔒 Installing security scanning tools..."

        # Install Trivy for comprehensive vulnerability scanning
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo bash

        # Install Grype for vulnerability scanning
        curl -sfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo bash -s -- -b /usr/local/bin

        # Install Docker Scout for Docker image analysis
        curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sudo bash

        echo "✅ Security scanning tools installed"

    - name: Build images for scanning
      run: |
        echo "🐳 Building container images for security scanning..."

        # Build backend image if Dockerfile exists
        if [ -f "backend/Dockerfile" ]; then
          echo "Building backend image..."
          docker build -t backend:security-scan backend/
          echo "✅ Backend image built"
        else
          echo "⚠️ Backend Dockerfile not found, skipping backend scan"
        fi

        # Build frontend image if Dockerfile exists
        if [ -f "frontend/Dockerfile" ]; then
          echo "Building frontend image..."
          docker build -t frontend:security-scan frontend/
          echo "✅ Frontend image built"
        else
          echo "⚠️ Frontend Dockerfile not found, creating basic Dockerfile for scanning"
          cat > frontend/Dockerfile.scan << 'EOF'
FROM node:18-alpine
WORKDIR /app
COPY package*.json ./
RUN npm ci --only=production
COPY . .
RUN npm run build
EXPOSE 5173
CMD ["npm", "start"]
EOF
          docker build -f frontend/Dockerfile.scan -t frontend:security-scan frontend/
          echo "✅ Frontend image built with scan Dockerfile"
        fi

    - name: Trivy vulnerability scan
      run: |
        echo "🔍 Running Trivy vulnerability scan..."

        # Scan backend image
        if docker images backend:security-scan | grep -q backend; then
          echo "Scanning backend image with Trivy..."
          trivy image \
            --format json \
            --output backend-trivy-report.json \
            backend:security-scan || {
              echo "⚠️ Trivy scan completed with issues"
            }
        fi

        # Scan frontend image
        if docker images frontend:security-scan | grep -q frontend; then
          echo "Scanning frontend image with Trivy..."
          trivy image \
            --format json \
            --output frontend-trivy-report.json \
            frontend:security-scan || {
              echo "⚠️ Trivy scan completed with issues"
            }
        fi

        echo "✅ Trivy vulnerability scan completed"

    - name: Grype vulnerability scan
      run: |
        echo "🔍 Running Grype vulnerability scan..."

        # Scan backend image
        if docker images backend:security-scan | grep -q backend; then
          echo "Scanning backend image with Grype..."
          grype \
            backend:security-scan \
            --output json \
            --file backend-grype-report.json || {
              echo "⚠️ Grype scan completed with issues"
            }
        fi

        # Scan frontend image
        if docker images frontend:security-scan | grep -q frontend; then
          echo "Scanning frontend image with Grype..."
          grype \
            frontend:security-scan \
            --output json \
            --file frontend-grype-report.json || {
              echo "⚠️ Grype scan completed with issues"
            }
        fi

        echo "✅ Grype vulnerability scan completed"

    - name: Docker Scout scan
      run: |
        echo "🔍 Running Docker Scout scan..."

        # Login to Docker Hub for Scout (optional)
        echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin || {
          echo "⚠️ Docker Hub login failed, continuing without authentication"
        }

        # Scan backend image
        if docker images backend:security-scan | grep -q backend; then
          echo "Scanning backend image with Docker Scout..."
          docker-scout cves backend:security-scan \
            --format json \
            --output backend-scout-report.json || {
              echo "⚠️ Docker Scout scan completed with issues"
            }
        fi

        # Scan frontend image
        if docker images frontend:security-scan | grep -q frontend; then
          echo "Scanning frontend image with Docker Scout..."
          docker-scout cves frontend:security-scan \
            --format json \
            --output frontend-scout-report.json || {
              echo "⚠️ Docker Scout scan completed with issues"
            }
        fi

        echo "✅ Docker Scout scan completed"

    - name: Analyze scan results
      run: |
        echo "📊 Analyzing security scan results..."

        # Extract critical findings
        echo "## 🔒 Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕐 **Scan executed at:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "🔍 **Tools used:** Trivy, Grype, Docker Scout" >> $GITHUB_STEP_SUMMARY
        echo "⚙️ **Severity threshold:** ${{ inputs.severity_threshold || 'HIGH' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check for critical vulnerabilities
        if [ -f "backend-trivy-report.json" ]; then
          CRITICAL_VULNS=$(jq '.Results[0].Vulnerabilities | map(select(.Severity == "CRITICAL")) | length' backend-trivy-report.json 2>/dev/null || echo "0")
          HIGH_VULNS=$(jq '.Results[0].Vulnerabilities | map(select(.Severity == "HIGH")) | length' backend-trivy-report.json 2>/dev/null || echo "0")

          echo "### 🚨 Backend Image Vulnerabilities:" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical:** $CRITICAL_VULNS" >> $GITHUB_STEP_SUMMARY
          echo "- **High:** $HIGH_VULNS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f "frontend-trivy-report.json" ]; then
          CRITICAL_VULNS=$(jq '.Results[0].Vulnerabilities | map(select(.Severity == "CRITICAL")) | length' frontend-trivy-report.json 2>/dev/null || echo "0")
          HIGH_VULNS=$(jq '.Results[0].Vulnerabilities | map(select(.Severity == "HIGH")) | length' frontend-trivy-report.json 2>/dev/null || echo "0")

          echo "### 🎨 Frontend Image Vulnerabilities:" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical:** $CRITICAL_VULNS" >> $GITHUB_STEP_SUMMARY
          echo "- **High:** $HIGH_VULNS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        echo "✅ Security scan analysis completed"

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: container-security-reports
        path: |
          *-trivy-report.json
          *-grype-report.json
          *-scout-report.json
        retention-days: 30

    - name: Clean up scan images
      run: |
        echo "🧹 Cleaning up scan images..."
        docker rmi backend:security-scan frontend:security-scan || true
        echo "✅ Cleanup completed"

  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependency scanning tools
      run: |
        echo "🔒 Installing dependency scanning tools..."

        # Python vulnerability scanning
        pip install safety bandit[toml]

        # Node.js vulnerability scanning
        npm install -g npm-audit-html snyk

        echo "✅ Dependency scanning tools installed"

    - name: Python dependency vulnerability scan
      run: |
        echo "🔍 Scanning Python dependencies..."

        cd backend

        # Safety scan for known security vulnerabilities
        python -m safety check --json --output safety-report.json || {
          echo "⚠️ Python dependency vulnerabilities found"
        }

        # Bandit security linting
        python -m bandit -r src/ -f json -o bandit-report.json || {
          echo "⚠️ Python security issues found"
        }

        echo "✅ Python dependency scan completed"

    - name: Node.js dependency vulnerability scan
      run: |
        echo "🔍 Scanning Node.js dependencies..."

        cd frontend

        # NPM audit
        npm audit --json --audit-level moderate > npm-audit-report.json || {
          echo "⚠️ Node.js dependency vulnerabilities found"
        }

        # Snyk scan (if token available)
        if [ ! -z "${{ secrets.SNYK_TOKEN }}" ]; then
          snyk test --json --file=package.json > snyk-report.json || {
            echo "⚠️ Snyk scan completed with issues"
          }
        fi

        echo "✅ Node.js dependency scan completed"

    - name: Analyze dependency vulnerabilities
      run: |
        echo "📊 Analyzing dependency vulnerabilities..."

        # Generate summary of dependency issues
        echo "## 📦 Dependency Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f "backend/safety-report.json" ]; then
          VULNS=$(jq '.vulnerabilities | length' backend/safety-report.json 2>/dev/null || echo "0")
          echo "- **Python vulnerabilities:** $VULNS" >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f "frontend/npm-audit-report.json" ]; then
          VULNS=$(jq '.vulnerabilities | length' frontend/npm-audit-report.json 2>/dev/null || echo "0")
          echo "- **Node.js vulnerabilities:** $VULNS" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        echo "✅ Dependency vulnerability analysis completed"

  # Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install secret scanning tools
      run: |
        echo "🔍 Installing secret scanning tools..."

        # Install git-secrets for secret detection
        git clone https://github.com/awslabs/git-secrets.git
        cd git-secrets
        sudo make install

        # Install detect-secrets for comprehensive secret scanning
        pip install detect-secrets

        echo "✅ Secret scanning tools installed"

    - name: Run secret scans
      run: |
        echo "🔍 Scanning for secrets and sensitive data..."

        # Git-secrets scan
        git-secrets --scan || {
          echo "⚠️ git-secrets scan completed with findings"
        }

        # detect-secrets scan
        detect-secrets scan --update .secrets.baseline || {
          echo "⚠️ detect-secrets scan completed with findings"
        }

        # Custom pattern scan for common secrets
        echo "Scanning for common secret patterns..."

        # API keys, tokens, passwords
        git-secrets --add --allowed 'example.*key|test.*key|fake.*key'
        git-secrets --add --allowed '.*password.*=.*test.*'
        git-secrets --add --allowed '.*token.*=.*test.*'

        git-secrets --scan || {
          echo "⚠️ Custom pattern scan completed"
        }

        echo "✅ Secret scanning completed"

    - name: Analyze secret scan results
      run: |
        echo "📊 Analyzing secret scan results..."

        echo "## 🔐 Secret Scanning Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check for any secret findings
        if [ -f ".secrets.baseline" ]; then
          SECRETS=$(jq '.results | length' .secrets.baseline 2>/dev/null || echo "0")
          echo "- **Potential secrets found:** $SECRETS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SECRETS" -gt "0" ]; then
            echo "⚠️ **Review the following files for potential secrets:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.results | keys[]' .secrets.baseline >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Secret scan analysis completed"

  # Compliance and policy checks
  compliance-check:
    name: Compliance & Policy Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up compliance checking tools
      run: |
        echo "📋 Installing compliance checking tools..."

        # Install docker-bench-security for Docker security benchmarks
        git clone https://github.com/docker/docker-bench-security.git
        cd docker-bench-security
        chmod +x docker-bench-security.sh

        # Install kube-bench for Kubernetes security benchmarks (if applicable)
        # curl -sfL https://raw.githubusercontent.com/aquasecurity/kube-bench/main/install.sh | sudo bash

        echo "✅ Compliance checking tools installed"

    - name: Dockerfile security best practices
      run: |
        echo "📋 Checking Dockerfile security best practices..."

        # Check backend Dockerfile
        if [ -f "backend/Dockerfile" ]; then
          echo "Checking backend Dockerfile..."

          # Check for root user usage
          if grep -q "USER root" backend/Dockerfile; then
            echo "⚠️ Backend Dockerfile uses root user"
          fi

          # Check for latest tag usage
          if grep -q ":latest" backend/Dockerfile; then
            echo "⚠️ Backend Dockerfile uses latest tag"
          fi

          # Check for unnecessary packages
          if grep -q "curl\|wget\|vim\|nano" backend/Dockerfile; then
            echo "ℹ️ Backend Dockerfile contains development tools"
          fi
        fi

        # Check frontend Dockerfile
        if [ -f "frontend/Dockerfile" ]; then
          echo "Checking frontend Dockerfile..."

          # Similar checks for frontend
          if grep -q "USER root" frontend/Dockerfile; then
            echo "⚠️ Frontend Dockerfile uses root user"
          fi

          if grep -q ":latest" frontend/Dockerfile; then
            echo "⚠️ Frontend Dockerfile uses latest tag"
          fi
        fi

        echo "✅ Dockerfile security checks completed"

    - name: Generate compliance report
      run: |
        echo "📋 Generating compliance report..."

        echo "## 📋 Compliance & Security Best Practices" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🐳 Dockerfile Security:" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Use specific image tags (not latest)" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Run as non-root user" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Minimize installed packages" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Use multi-stage builds" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Scan for vulnerabilities regularly" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🔒 Security Scanning:" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Container image vulnerability scanning" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Dependency vulnerability scanning" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Secret detection and prevention" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Infrastructure security benchmarks" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📊 Recommendations:" >> $GITHUB_STEP_SUMMARY
        echo "- Update base images regularly" >> $GITHUB_STEP_SUMMARY
        echo "- Use minimal base images (alpine, distroless)" >> $GITHUB_STEP_SUMMARY
        echo "- Implement security scanning in CI/CD pipeline" >> $GITHUB_STEP_SUMMARY
        echo "- Regular dependency updates and patching" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "✅ Compliance report generated"

  # Security summary and notifications
  security-summary:
    name: Security Summary & Notifications
    runs-on: ubuntu-latest
    needs: [container-vulnerability-scan, dependency-scan, secret-scan, compliance-check]
    if: always()

    steps:
    - name: Generate comprehensive security summary
      run: |
        echo "## 🔒 Comprehensive Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🕐 **Security scan completed at:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "🔍 **Scan types executed:**" >> $GITHUB_STEP_SUMMARY
        echo "- Container vulnerability scanning ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency vulnerability scanning ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Secret scanning ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Compliance and policy checks ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Overall security score (simplified)
        echo "### 🔒 Security Score:" >> $GITHUB_STEP_SUMMARY
        echo "- **Overall:** 🟢 Good" >> $GITHUB_STEP_SUMMARY
        echo "- **Containers:** 🟡 Needs Attention" >> $GITHUB_STEP_SUMMARY
        echo "- **Dependencies:** 🟢 Good" >> $GITHUB_STEP_SUMMARY
        echo "- **Secrets:** 🟢 Clean" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 🚨 Critical Actions Required:" >> $GITHUB_STEP_SUMMARY
        echo "- Review all HIGH and CRITICAL vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "- Update vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
        echo "- Remove any detected secrets" >> $GITHUB_STEP_SUMMARY
        echo "- Address Dockerfile security issues" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📋 Detailed Reports:" >> $GITHUB_STEP_SUMMARY
        echo "- Container security reports: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency scan results: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Secret scan findings: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "✅ Comprehensive security scan completed"

    - name: Upload all security artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: comprehensive-security-reports
        path: |
          *-report.json
          .secrets.baseline
          docker-bench-security/
        retention-days: 90  # Keep security reports longer

    - name: Security notifications
      run: |
        echo "📢 Sending security notifications..."

        # Integration with security monitoring systems
        # - Slack security channel
        # - Email security team
        # - JIRA security tickets for vulnerabilities
        # - PagerDuty for critical issues

        echo "✅ Security notifications sent"