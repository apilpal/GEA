name: Create GEA roadmap issues

# Creates the UI, privacy and security roadmap issues (UI-PRIVACY-SECURITY-PLAN.md).
# The issue texts live in .github/issue-data/roadmap-issues.json, not in this file:
# GitHub refuses a workflow whose inline script is longer than 21,000 characters.
# Run it once with "confirm_create" unticked to preview, then again ticked to create.
# An issue that already exists (same title, or same GEA-ROADMAP marker) is skipped.

on:
  workflow_dispatch:
    inputs:
      confirm_create:
        description: "Set true to create the missing roadmap issues (false = preview only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  create-roadmap-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the issue texts
        uses: actions/checkout@v4

      - name: Preview or create missing roadmap issues
        uses: actions/github-script@v7
        env:
          CONFIRM_CREATE: ${{ inputs.confirm_create }}
        with:
          script: |
            const fs = require("fs");
            const confirmCreate = process.env.CONFIRM_CREATE === "true";
            const data = JSON.parse(fs.readFileSync(".github/issue-data/roadmap-issues.json", "utf8"));
            const epicRefs = data.epicRefs;
            const issues = data.issues;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100
            });

            const existingTitles = new Set(existing.map(item => item.title.toLowerCase()));
            const existingMarkers = new Set(
              existing.map(item => (item.body || "").match(/<!-- GEA-ROADMAP:([A-Z]+-\d+) -->/)?.[1]).filter(Boolean)
            );

            const results = [];
            for (const item of issues) {
              const marker = `<!-- GEA-ROADMAP:${item.key} -->`;
              const titleExists = existingTitles.has(item.title.toLowerCase());
              const markerExists = existingMarkers.has(item.key);
              if (titleExists || markerExists) {
                results.push({ key: item.key, result: "skipped (already exists)" });
                continue;
              }

              const epic = epicRefs[item.key.split("-")[0]];
              const body = `${marker}\n\n${item.body}\n\n---\n**Epic:** #${epic}\n**Roadmap:** GEA UI, privacy and security plan`;
              if (!confirmCreate) {
                results.push({ key: item.key, result: "preview only" });
                continue;
              }

              const created = await github.rest.issues.create({
                owner, repo, title: item.title, body
              });
              existingTitles.add(item.title.toLowerCase());
              existingMarkers.add(item.key);
              results.push({ key: item.key, result: "created", number: created.data.number, url: created.data.html_url });
            }

            core.summary
              .addHeading("GEA roadmap issue creation")
              .addTable([
                [{data: "Issue key", header: true}, {data: "Result", header: true}, {data: "Issue", header: true}],
                ...results.map(row => [row.key, row.result, row.url ? `[ #${row.number} ](${row.url})` : "\u2014"])
              ])
              .addRaw(`\nMode: ${confirmCreate ? "CREATE" : "PREVIEW ONLY"}\n`)
              .write();

            const createdCount = results.filter(row => row.result === "created").length;
            const skippedCount = results.filter(row => row.result.startsWith("skipped")).length;
            core.info(`Roadmap items: ${issues.length}; created: ${createdCount}; skipped: ${skippedCount}; preview-only: ${results.filter(row => row.result === "preview only").length}`);
