coverage:
  precision: 2
  round: down
  range: "75...95"

  status:
    project:
      default:
        target: 85%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

  ignore:
    - "backend/tests/"
    - "backend/conftest.py"
    - "frontend/__tests__/"
    - "**/*.test.js"
    - "**/*.test.ts"
    - "**/*.test.py"
    - "**/test_*.py"
    - "frontend/src/test-*.ts"
    - "docs/"
    - "**/__pycache__/"
    - "**/*.pyc"
    - "**/migrations/"
    - "**/alembic/"

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes
  require_base: no
  require_head: yes
  hide_project_coverage: false

github_checks:
  annotations: true

slack:
  # Optional: configure Slack notifications
  default:
    enabled: false

codecov:
  # Configure Codecov behavior
  strict_yaml_branch: main
  max_report_age: off
  disable_default_path_fixes: false
  require_ci_to_pass: yes
  require_coverage: yes
  coverage_increase: off

  # Coverage targeting
  target: 85%
  round: down
  precision: 2

  # Branch coverage
  branch_coverage: yes
  branch_increase: off

  # Status checks
  status:
    project:
      default:
        target: 85%
        threshold: 1%
        branches:
          - main
          - develop
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 1%
        if_no_uploads: error
        if_not_found: success
        if_ci_failed: error

  # Coverage reporting
  notify:
    after_n_builds: 1
    wait_for_ci: yes

# Coverage flags for different test types
flags:
  unit:
    name: "Unit Tests"
    paths:
      - backend/src/
    carryforward: true
    require_changes: false

  integration:
    name: "Integration Tests"
    paths:
      - backend/src/
    carryforward: true
    require_changes: false

  api:
    name: "API Tests"
    paths:
      - backend/src/api/
    carryforward: true
    require_changes: false

  services:
    name: "Service Tests"
    paths:
      - backend/src/services/
    carryforward: true
    require_changes: false

  models:
    name: "Model Tests"
    paths:
      - backend/src/core/models/
    carryforward: true
    require_changes: false